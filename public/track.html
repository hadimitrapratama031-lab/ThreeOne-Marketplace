<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.ico">
  <meta name="theme-color" content="#080807">
  <meta name="robots" content="noindex, nofollow">
  <title>Cek Pesanan — Marketplace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/background.css">
  <link rel="stylesheet" href="css/livechat.css">
  <link rel="stylesheet" href="css/pay.css">
  <link rel="stylesheet" href="css/track.css">
</head>
<body>

  <!-- Background system (sama dengan Home & Product; zona "products" = paling tenang) -->
  <div class="marketplace-background" data-zone="products" aria-hidden="true">
    <div class="bg-base"></div>
    <div class="bg-ambient">
      <i class="bg-glow bg-glow--1"></i>
      <i class="bg-glow bg-glow--2"></i>
      <i class="bg-glow bg-glow--3"></i>
    </div>
    <div class="bg-particles"></div>
    <div class="bg-noise"></div>
  </div>

  <header class="site-header" id="site-header">
    <div class="container header__bar">
      <a class="logo enter" href="index.html#home"></a>

      <div class="nav-wrap enter" style="--d:.12s">
        <nav class="nav" id="main-nav" aria-label="Navigasi utama">
          <a href="index.html#home">Home</a>
          <a href="index.html#product">Product</a>
          <a href="index.html#faq">FAQ</a>
          <a href="index.html#contact">Contact</a>
          <a href="rating.html">Rating</a>
        </nav>
      </div>

      <div class="header__actions enter" style="--d:.2s">
        <a class="btn btn--ghost" href="track.html" aria-current="page">Cek Pesanan</a>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 8h16M4 16h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="zone zone--products bg-grid pay" data-zone="products">
      <div class="pay-wrap" id="trk-root"></div>
    </section>
  </main>

  <p class="sr-only" id="pay-live" role="status" aria-live="polite"></p>

  <footer class="site-footer zone zone--footer" data-zone="footer">
    <div class="container footer__row">
      <a class="logo" href="index.html#home"></a>
      <div class="footer__links">
        <a href="index.html#home">Home</a>
        <a href="index.html#product">Product</a>
        <a href="index.html#faq">FAQ</a>
        <a href="index.html#contact">Contact</a>
        <a href="rating.html">Rating</a>
      </div>
      <small id="copyright"></small>
    </div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/live.js"></script>
  <script src="js/script.js"></script>
  <script src="js/track.js"></script>
  <script src="js/livechat.js"></script>
  <script src="js/background.js"></script>
</body>
</html>
