<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080807">
  <title>Marketplace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/background.css">
  <link rel="stylesheet" href="css/product.css">
</head>
<body>

  <!-- Background system (sama dengan Home; zona "products" = paling tenang) -->
  <div class="marketplace-background" data-zone="products" aria-hidden="true">
    <div class="bg-base"></div>
    <div class="bg-ambient">
      <i class="bg-glow bg-glow--1"></i>
      <i class="bg-glow bg-glow--2"></i>
      <i class="bg-glow bg-glow--3"></i>
    </div>
    <div class="bg-particles"></div>
    <div class="bg-noise"></div>
  </div>

  <!-- Header (sama dengan Home; tautan mengarah ke index.html) -->
  <header class="site-header" id="site-header">
    <div class="container header__bar">
      <a class="logo enter" href="index.html#home"></a>

      <div class="nav-wrap enter" style="--d:.12s">
        <nav class="nav" id="main-nav" aria-label="Navigasi utama">
          <a href="index.html#home">Home</a>
          <a href="index.html#product" class="on">Product</a>
          <a href="index.html#faq">FAQ</a>
          <a href="index.html#contact">Contact</a>
          <a href="rating.html">Rating</a>
        </nav>
      </div>

      <div class="header__actions enter" style="--d:.2s">
        <a class="btn btn--ghost" href="#" data-placeholder>Cek Pesanan</a>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 8h16M4 16h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="zone zone--products bg-grid pd" data-zone="products">
      <div class="container" id="pd-root"></div>
    </section>
  </main>

  <footer class="site-footer zone zone--footer" data-zone="footer">
    <div class="container footer__row">
      <a class="logo" href="index.html#home"></a>
      <div class="footer__links">
        <a href="index.html#home">Home</a>
        <a href="index.html#product">Product</a>
        <a href="index.html#faq">FAQ</a>
        <a href="index.html#contact">Contact</a>
        <a href="rating.html">Rating</a>
      </div>
      <small id="copyright"></small>
    </div>
  </footer>

  <!-- Lightbox foto ulasan -->
  <dialog class="pd-lightbox" id="pd-lightbox" aria-label="Pratinjau foto ulasan">
    <button class="pd-close" id="pd-close" type="button" aria-label="Tutup pratinjau">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="pd-lightbox__img" id="pd-lightbox-img"></div>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/live.js"></script>
  <script src="js/script.js"></script>
  <script src="js/product.js"></script>
  <script src="js/background.js"></script>
</body>
</html>
